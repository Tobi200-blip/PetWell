name: Compress hero video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compress with ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -y -i public/home-hero-original.mp4 \
            -vf "scale='min(1280,iw)':-2" \
            -c:v libx264 -crf 28 -preset veryfast -pix_fmt yuv420p \
            -an -movflags +faststart public/home-hero.mp4
          ls -la public/home-hero.mp4

      - name: Commit the compressed video
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -q --cached public/home-hero-original.mp4 || true
          git add public/home-hero.mp4
          git diff --cached --quiet || git commit -m "Compress hero video"
          git push
