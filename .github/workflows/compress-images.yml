name: Compress images

# Run by hand: GitHub -> Actions tab -> "Compress images" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Compress photos
        run: python scripts/compress_images.py --no-backup

      - name: Commit the smaller photos
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A src/assets
          git diff --cached --quiet || git commit -m "Compress images"
          git push